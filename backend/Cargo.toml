[package]
name = "poem_project"
version = "0.1.0"
edition = "2024"
default-run = "poem_project"

[lib]
path = "src/lib.rs"

[[bin]]
name = "poem_project"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[dependencies]
diesel = {version = "2.3.2", features = ["sqlite"]}
dotenvy = "0.15.7"
poem = "3.1.12"
poem-openapi = {version = "5.1.16", features = ["swagger-ui"]}
serde = {version = "1.0", features = ["derive"]}
tokio = {version = "1.48.0", features = ["full"]}
fake = "2.9"
rand = "0.8"
